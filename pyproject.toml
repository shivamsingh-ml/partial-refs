[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "partialref"
version = "0.0.1"
description = "Propensity-corrected evaluation of report generation under partial references"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
review = ["streamlit==1.67.0", "pyarrow"]   # report review app on a laptop: pip install -e ".[review]"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
